<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Đăng Bài</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-form { display: flex; flex-direction: column; gap: 15px; }
        input, select, textarea { padding: 10px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 5px; font-family: inherit; }
        textarea { height: 200px; resize: vertical; }
        button { padding: 10px; background: var(--accent-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #3182ce; }
    </style>
</head>
<body>
    <header>
        <h1>[ Cổng Đăng Bài Admin ]</h1>
    </header>

    <main id="post-container">
        <form id="uploadForm" class="admin-form">
            <!-- Mã bí mật để xác thực quyền ghi -->
            <input type="password" id="adminSecret" placeholder="Nhập mã bí mật Database Secret..." required>
            
            <input type="text" id="postTitle" placeholder="Tiêu đề bài viết" required>
            
            <select id="postLanguage">
                <option value="lua">Lua</option>
                <option value="javascript">JavaScript</option>
                <option value="cpp">C++</option>
                <option value="csharp">C#</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="none">Văn bản thường</option>
            </select>

            <textarea id="postContent" placeholder="Dán nội dung hoặc Code vào đây..." required></textarea>
            
            <button type="submit">Đăng Lên Database</button>
        </form>
        <p id="statusMsg" style="text-align: center; margin-top: 15px;"></p>
    </main>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            const status = document.getElementById("statusMsg");
            
            const secret = document.getElementById("adminSecret").value;
            const title = document.getElementById("postTitle").value;
            const language = document.getElementById("postLanguage").value;
            const content = document.getElementById("postContent").value;

            btn.disabled = true;
            btn.innerText = "Đang tải lên...";

            const postData = { title, language, content, timestamp: Date.now() };
            // Đẩy dữ liệu lên Firebase kèm theo mã bí mật (auth parameter)
            const dbUrl = \`https://noitu-5f24c-default-rtdb.firebaseio.com/posts.json?auth=\${secret}\`;

            try {
                const response = await fetch(dbUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(postData)
                });

                if (response.ok) {
                    status.innerText = "✅ Đăng bài thành công!";
                    status.style.color = "#2ea043";
                    e.target.reset(); // Xóa form
                } else {
                    const err = await response.json();
                    status.innerText = "❌ Lỗi: Mã bí mật sai hoặc không có quyền!";
                    status.style.color = "#f85149";
                }
            } catch (error) {
                status.innerText = "❌ Lỗi kết nối!";
            } finally {
                btn.disabled = false;
                btn.innerText = "Đăng Lên Database";
            }
        });
    </script>
</body>
</html>
