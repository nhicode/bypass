<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Lưu Trữ Của Ngân</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-twilight.min.css" rel="stylesheet" />
    <style>
        :root { 
            --bg-body: #f4f4f9; --bg-card: #ffffff; --text-main: #333333; 
            --text-muted: #666666; --accent: #6c5ce7; --border: #e1e1e8;
        }
        body { font-family: sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 750px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--accent); margin: 0; }
        
        .fab-button {
            display: block; width: 100%; max-width: 250px; margin: 0 auto 30px auto;
            background: var(--accent); color: white; border: none; 
            padding: 12px; border-radius: 50px; font-weight: bold; cursor: pointer;
        }
        
        .post { background: var(--bg-card); border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); overflow: hidden; }
        .post-header { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border); }
        .post-header h2 { margin: 0; font-size: 1.1rem; }
        .copy-btn { background: #f0f0f5; color: var(--accent); border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .copy-btn.copied { background: #00b894; color: white; }
        pre[class*="language-"] { margin: 0 !important; border-radius: 0 0 12px 12px !important; border: none !important; }

        /* Khung Popup */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-card); width: 90%; max-width: 400px; padding: 25px; 
            border-radius: 16px; position: relative;
        }
        .input-group { margin-bottom: 15px; }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
        }
        .input-group textarea { height: 150px; }
        .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-close { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; }
        #error-msg { color: red; text-align: center; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✦ Góc Lưu Trữ ✦</h1>
            <p>Nơi cất giữ Script</p>
        </header>

        <!-- Nút mở Popup -->
        <button class="fab-button" onclick="openLogin()">+ Đăng Bài Mới</button>

        <main id="post-container">
            <p id="loading" style="text-align:center;">Đang kết nối tới máy chủ...</p>
        </main>
    </div>

    <!-- Popup Đăng Nhập -->
    <div class="modal-overlay" id="login-modal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModals()">×</button>
            <h2 style="color: var(--accent); text-align: center; margin-top: 0;">Xác Minh</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Tài khoản">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Mật khẩu">
            </div>
            <button class="btn-submit" onclick="checkLogin()">Đăng Nhập</button>
            <p id="error-msg">Sai tài khoản hoặc mật khẩu!</p>
        </div>
    </div>

    <!-- Popup Đăng Bài -->
    <div class="modal-overlay" id="post-modal">
        <div class="modal-content" style="max-width: 500px;">
            <button class="btn-close" onclick="closeModals()">×</button>
            <h2 style="color: var(--accent); text-align: center; margin-top: 0;">Viết Bài</h2>
            <div class="input-group">
                <input type="text" id="post-title" placeholder="Tiêu đề...">
            </div>
            <div class="input-group">
                <select id="post-lang">
                    <option value="lua">Lua</option>
                    <option value="javascript">JavaScript</option>
                    <option value="cpp">C++</option>
                    <option value="csharp">C#</option>
                    <option value="none">Văn bản bình thường</option>
                </select>
            </div>
            <div class="input-group">
                <textarea id="post-content" placeholder="Dán nội dung script..."></textarea>
            </div>
            <button class="btn-submit" id="submit-post-btn" onclick="submitPost()">Đẩy Lên Server</button>
            <p id="post-status" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>

    <script>
        const DB_URL = "https://noitu-5f24c-default-rtdb.firebaseio.com/posts.json";

        // Tải danh sách bài
        async function fetchPosts() {
            const container = document.getElementById("post-container");
            const loading = document.getElementById("loading");
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                if (data) {
                    loading.remove();
                    container.innerHTML = ""; 
                    const postsArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                    
                    postsArray.forEach(post => {
                        const article = document.createElement("article");
                        article.className = "post";
                        article.innerHTML = `
                            <div class="post-header">
                                <h2>${post.title}</h2>
                                <button class="copy-btn" data-code="${encodeURIComponent(post.content)}">Copy</button>
                            </div>
                            <pre><code class="language-${post.language}">${escapeHTML(post.content)}</code></pre>
                        `;
                        container.appendChild(article);
                    });
                    
                    Prism.highlightAll();

                    document.querySelectorAll(".copy-btn").forEach(btn => {
                        btn.addEventListener("click", function() {
                            const code = decodeURIComponent(this.getAttribute("data-code"));
                            navigator.clipboard.writeText(code).then(() => {
                                const old = this.innerText;
                                this.innerText = "Đã Copy!";
                                this.classList.add("copied");
                                setTimeout(() => { this.innerText = old; this.classList.remove("copied"); }, 2000);
                            });
                        });
                    });
                } else {
                    loading.innerText = "Chưa có bài đăng nào.";
                }
            } catch (e) {
                loading.innerText = "Lỗi kết nối Server.";
            }
        }

        document.addEventListener("DOMContentLoaded", fetchPosts);

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        // --- XỬ LÝ POPUP ---
        function openLogin() {
            document.getElementById("login-modal").classList.add("active");
            document.getElementById("error-msg").style.display = "none";
        }

        function closeModals() {
            document.getElementById("login-modal").classList.remove("active");
            document.getElementById("post-modal").classList.remove("active");
        }

        function checkLogin() {
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            
            if (u === "ngan2311" && p === "123456Hh") {
                document.getElementById("login-modal").classList.remove("active");
                document.getElementById("post-modal").classList.add("active");
                document.getElementById("post-title").value = "";
                document.getElementById("post-content").value = "";
                document.getElementById("post-status").innerText = "";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        async function submitPost() {
            const title = document.getElementById("post-title").value;
            const language = document.getElementById("post-lang").value;
            const content = document.getElementById("post-content").value;
            const btn = document.getElementById("submit-post-btn");
            const status = document.getElementById("post-status");

            if (!title || !content) {
                status.innerText = "Vui lòng nhập đủ thông tin!";
                status.style.color = "red";
                return;
            }

            btn.innerText = "Đang tải lên...";
            btn.disabled = true;

            const postData = { title, language, content, timestamp: Date.now() };

            try {
                // Đẩy thẳng lên không cần auth (Yêu cầu Rule .write: true)
                const res = await fetch(DB_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(postData)
                });

                if (res.ok) {
                    status.innerText = "Đã đẩy lên Server!";
                    status.style.color = "green";
                    setTimeout(() => {
                        closeModals();
                        fetchPosts();
                    }, 1000);
                } else {
                    status.innerText = "Lỗi Server từ chối!";
                    status.style.color = "red";
                }
            } catch (e) {
                status.innerText = "Lỗi kết nối mạng!";
                status.style.color = "red";
            } finally {
                btn.innerText = "Đẩy Lên Server";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
