<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <h1>Code</h1>
            <p>Kho lưu trữ Script cá nhân</p>
        </header>

        <button class="fab-button" onclick="openLogin()">+ Viết Script Mới</button>

        <main id="post-container">
            <p id="loading" style="text-align:center;">Đang tải dữ liệu từ Server...</p>
        </main>
    </div>

    <div class="modal-overlay" id="login-modal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModals()">×</button>
            <h2 class="modal-title">Xác Minh</h2>
            <div class="input-group"><input type="text" id="username" placeholder="Tên đăng nhập"></div>
            <div class="input-group"><input type="password" id="password" placeholder="Mật khẩu"></div>
            <button class="btn-submit" onclick="checkLogin()">Mở Khóa</button>
            <p id="error-msg">Sai tài khoản hoặc mật khẩu!</p>
        </div>
    </div>

    <div class="modal-overlay" id="post-modal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModals()">×</button>
            <h2 class="modal-title">Lưu Script</h2>
            <div class="input-group"><input type="text" id="post-title" placeholder="Tiêu đề..."></div>
            <div class="input-group">
                <select id="post-lang">
                    <option value="lua">Lua</option>
                    <option value="javascript">JavaScript</option>
                    <option value="cpp">C++</option>
                    <option value="csharp">C#</option>
                    <option value="none">Văn bản thuần túy</option>
                </select>
            </div>
            <div class="input-group"><textarea id="post-content" placeholder="Dán Script vào đây..."></textarea></div>
            <button class="btn-submit" id="submit-post-btn" onclick="submitPost()">Lưu Lên Cloud</button>
            <p id="post-status"></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>

    <script>
        // --- 1. SCRIPT VẼ HÌNH NỀN ĐỘNG (LIQUID ORBS - FIX LỖI TỐC ĐỘ & ĐỘ SÁNG) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const orbs = [];
        const colors = ['#e0c3fc', '#8ec5fc', '#ff9a9e', '#fecfef']; // Bảng màu iOS sáng
        for (let i = 0; i < 8; i++) {
            orbs.push({
                x: Math.random() * width, y: Math.random() * height,
                r: Math.random() * 200 + 150,
                dx: (Math.random() - 0.5) * 1.0, dy: (Math.random() - 0.5) * 1.0, // Chậm hơn cho iOS
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        function drawBackground() {
            // FIX: Cập nhật Rule .read true để hiển thị Data
            ctx.fillStyle = "#f4f5f7"; // Màu lót tối thiểu
            ctx.fillRect(0, 0, width, height);
            
            orbs.forEach(orb => {
                orb.x += orb.dx; orb.y += orb.dy;
                if (orb.x < -orb.r || orb.x > width + orb.r) orb.dx *= -1;
                if (orb.y < -orb.r || orb.y > height + orb.r) orb.dy *= -1;

                const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
                grad.addColorStop(0, orb.color);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fill();
            });
            requestAnimationFrame(drawBackground);
        }
        drawBackground(); // Khởi chạy nền động

        // --- 2. LOGIC DATABASE VÀ HIỂN THỊ WEB ---
        const DB_URL = "https://noitu-5f24c-default-rtdb.firebaseio.com/posts.json";

        async function fetchPosts() {
            const container = document.getElementById("post-container");
            const loading = document.getElementById("loading");
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                if (data) {
                    loading.remove();
                    container.innerHTML = ""; 
                    const postsArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                    
                    postsArray.forEach(post => {
                        const article = document.createElement("article");
                        article.className = "post";
                        article.innerHTML = `
                            <div class="post-header" onclick="toggleCode(this)">
                                <h2>${post.title}</h2>
                                <div class="action-group">
                                    <span style="font-size: 0.8rem; color: #515154; margin-right: 5px;">View</span>
                                    <button class="copy-btn" data-code="${encodeURIComponent(post.content)}" onclick="event.stopPropagation();">Copy</button>
                                </div>
                            </div>
                            <div class="code-content">
                                <pre><code class="language-${post.language}">${escapeHTML(post.content)}</code></pre>
                            </div>
                        `;
                        container.appendChild(article);
                    });
                    
                    Prism.highlightAll();

                    document.querySelectorAll(".copy-btn").forEach(btn => {
                        btn.addEventListener("click", function(e) {
                            e.stopPropagation(); // FIX: Chống click copy kích hoạt mở header
                            const code = decodeURIComponent(this.getAttribute("data-code"));
                            navigator.clipboard.writeText(code).then(() => {
                                const old = this.innerText;
                                this.innerText = "Đã Copy!";
                                this.classList.add("copied");
                                setTimeout(() => { this.innerText = old; this.classList.remove("copied"); }, 2000);
                            });
                        });
                    });
                } else {
                    loading.innerText = "Kho dữ liệu trống.";
                }
            } catch (e) {
                loading.innerText = "Lỗi kết nối Server.";
            }
        }

        document.addEventListener("DOMContentLoaded", fetchPosts);

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        // Script Mở/Đóng code (Sửa lỗi nhận vào header)
        function toggleCode(header) {
            const post = header.closest('.post');
            const codeBlock = post.querySelector('.code-content');
            
            if (codeBlock.classList.contains('show')) {
                // Thu gọn
                codeBlock.classList.remove('show');
                post.classList.remove('expanded');
            } else {
                // FIX: Đóng tất cả các bài khác để nhìn bài này cho dễ
                document.querySelectorAll('.code-content.show').forEach(el => el.classList.remove('show'));
                document.querySelectorAll('.post.expanded').forEach(el => el.classList.remove('expanded'));

                // Mở rộng full
                codeBlock.classList.add('show');
                post.classList.add('expanded');
                
                // FIX: Tự động cuộn đến bài được mở cho mượt
                setTimeout(() => {
                    post.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        }

        function openLogin() { document.getElementById("login-modal").classList.add("active"); document.getElementById("error-msg").style.display = "none"; }
        function closeModals() { document.getElementById("login-modal").classList.remove("active"); document.getElementById("post-modal").classList.remove("active"); }

        function checkLogin() {
            if (document.getElementById("username").value === "ngan2311" && document.getElementById("password").value === "123456Hh") {
                document.getElementById("login-modal").classList.remove("active");
                document.getElementById("post-modal").classList.add("active");
                document.getElementById("post-title").value = ""; document.getElementById("post-content").value = ""; document.getElementById("post-status").innerText = "";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        async function submitPost() {
            const title = document.getElementById("post-title").value;
            const language = document.getElementById("post-lang").value;
            const content = document.getElementById("post-content").value;
            const btn = document.getElementById("submit-post-btn");
            const status = document.getElementById("post-status");

            if (!title || !content) { status.innerText = "Nhập đủ thông tin!"; status.style.color = "#ff3b30"; return; }
            btn.innerText = "Đang xử lý..."; btn.disabled = true;

            try {
                const res = await fetch(DB_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title, language, content, timestamp: Date.now() }) });
                if (res.ok) {
                    status.innerText = "Tải lên thành công!"; status.style.color = "#34c759";
                    setTimeout(() => { closeModals(); fetchPosts(); }, 1000);
                } else { status.innerText = "Lỗi Server!"; status.style.color = "#ff3b30"; }
            } catch (e) { status.innerText = "Lỗi mạng!"; status.style.color = "#ff3b30"; } 
            finally { btn.innerText = "Lưu Lên Cloud"; btn.disabled = false; }
        }
    </script>
</body>
</html>
