<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pro Bypasser - Quyền Lực Thuộc Về Tôi</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 90%; max-width: 500px; text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        #result { margin-top: 20px; padding: 15px; background: #064e3b; border: 1px solid #059669; border-radius: 8px; display: none; word-wrap: break-word; }
        a { color: #34d399; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🚀 Trạm Khử Link (Tự Code)</h2>
        <input type="url" id="link" placeholder="Dán link vào đây...">
        <button id="btn">Phá Link</button>
        <div id="result">
            <div style="font-size: 12px; color: #a7f3d0;" id="method"></div>
            <a id="output" href="#" target="_blank"></a>
        </div>
    </div>

    <script>
        document.getElementById('btn').addEventListener('click', async () => {
            const url = document.getElementById('link').value;
            const btn = document.getElementById('btn');
            const resBox = document.getElementById('result');
            
            btn.innerText = "Đang xử lý...";
            resBox.style.display = 'none';

            try {
                // Gọi vào API Node.js của chính bạn!
                const res = await fetch('/api/bypass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                
                resBox.style.display = 'block';
                if (data.success) {
                    resBox.style.background = '#064e3b';
                    document.getElementById('method').innerText = `Thuật toán: ${data.method}`;
                    document.getElementById('output').innerText = data.result;
                    document.getElementById('output').href = data.result;
                } else {
                    resBox.style.background = '#7f1d1d';
                    document.getElementById('method').innerText = "Thất bại!";
                    document.getElementById('output').innerText = data.message;
                    document.getElementById('output').removeAttribute('href');
                }
            } catch (e) {
                alert("Lỗi kết nối đến Server của bạn!");
            } finally {
                btn.innerText = "Phá Link";
            }
        });
    </script>
</body>
</html>
