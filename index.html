<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Lưu Trữ Của Ngân</title>
    <!-- Giao diện tô màu code nền sáng, chuẩn sạch sẽ -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
    <!-- Gọi file CSS chứa giao diện Glassmorphism -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Kho Script Của Ngân</h1>
            <p>Hệ thống tự động lưu trữ trên Cloud</p>
        </header>

        <!-- Nút mở Popup -->
        <button class="fab-button" onclick="openLogin()">+ Viết Script Mới</button>

        <main id="post-container">
            <p id="loading" style="text-align:center;">Đang tải dữ liệu, vui lòng chờ...</p>
        </main>
    </div>

    <!-- Popup Đăng Nhập -->
    <div class="modal-overlay" id="login-modal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModals()">×</button>
            <h2 class="modal-title">Xác Minh Danh Tính</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Tên đăng nhập">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Mật khẩu">
            </div>
            <button class="btn-submit" onclick="checkLogin()">Mở Khóa Cổng Đăng</button>
            <p id="error-msg">Sai tài khoản hoặc mật khẩu!</p>
        </div>
    </div>

    <!-- Popup Đăng Bài -->
    <div class="modal-overlay" id="post-modal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModals()">×</button>
            <h2 class="modal-title">Lưu Script Lên Server</h2>
            <div class="input-group">
                <input type="text" id="post-title" placeholder="Tiêu đề script...">
            </div>
            <div class="input-group">
                <select id="post-lang">
                    <option value="lua">Ngôn ngữ: Lua</option>
                    <option value="javascript">Ngôn ngữ: JavaScript</option>
                    <option value="cpp">Ngôn ngữ: C++</option>
                    <option value="csharp">Ngôn ngữ: C#</option>
                    <option value="none">Văn bản thuần túy</option>
                </select>
            </div>
            <div class="input-group">
                <textarea id="post-content" placeholder="Dán nội dung script của bạn vào đây (Sẽ hiển thị trên nền trắng)..."></textarea>
            </div>
            <button class="btn-submit" id="submit-post-btn" onclick="submitPost()">Đẩy Dữ Liệu</button>
            <p id="post-status"></p>
        </div>
    </div>

    <!-- Thư viện tô màu (Xử lý các ngôn ngữ lập trình) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>

    <script>
        const DB_URL = "https://noitu-5f24c-default-rtdb.firebaseio.com/posts.json";

        async function fetchPosts() {
            const container = document.getElementById("post-container");
            const loading = document.getElementById("loading");
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                if (data) {
                    loading.remove();
                    container.innerHTML = ""; 
                    const postsArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                    
                    postsArray.forEach(post => {
                        const article = document.createElement("article");
                        article.className = "post";
                        article.innerHTML = `
                            <div class="post-header">
                                <h2>${post.title}</h2>
                                <button class="copy-btn" data-code="${encodeURIComponent(post.content)}">Sao Chép</button>
                            </div>
                            <pre><code class="language-${post.language}">${escapeHTML(post.content)}</code></pre>
                        `;
                        container.appendChild(article);
                    });
                    
                    Prism.highlightAll();

                    document.querySelectorAll(".copy-btn").forEach(btn => {
                        btn.addEventListener("click", function() {
                            const code = decodeURIComponent(this.getAttribute("data-code"));
                            navigator.clipboard.writeText(code).then(() => {
                                const old = this.innerText;
                                this.innerText = "Đã Copy!";
                                this.classList.add("copied");
                                setTimeout(() => { this.innerText = old; this.classList.remove("copied"); }, 2000);
                            });
                        });
                    });
                } else {
                    loading.innerText = "Kho dữ liệu trống.";
                }
            } catch (e) {
                loading.innerText = "Lỗi kết nối tới Server.";
            }
        }

        document.addEventListener("DOMContentLoaded", fetchPosts);

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        function openLogin() {
            document.getElementById("login-modal").classList.add("active");
            document.getElementById("error-msg").style.display = "none";
        }

        function closeModals() {
            document.getElementById("login-modal").classList.remove("active");
            document.getElementById("post-modal").classList.remove("active");
        }

        function checkLogin() {
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            
            if (u === "ngan2311" && p === "123456Hh") {
                document.getElementById("login-modal").classList.remove("active");
                document.getElementById("post-modal").classList.add("active");
                document.getElementById("post-title").value = "";
                document.getElementById("post-content").value = "";
                document.getElementById("post-status").innerText = "";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        async function submitPost() {
            const title = document.getElementById("post-title").value;
            const language = document.getElementById("post-lang").value;
            const content = document.getElementById("post-content").value;
            const btn = document.getElementById("submit-post-btn");
            const status = document.getElementById("post-status");

            if (!title || !content) {
                status.innerText = "Vui lòng nhập đủ thông tin!";
                status.style.color = "#ff3b30";
                return;
            }

            btn.innerText = "Đang xử lý...";
            btn.disabled = true;

            const postData = { title, language, content, timestamp: Date.now() };

            try {
                const res = await fetch(DB_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(postData)
                });

                if (res.ok) {
                    status.innerText = "Tải lên thành công!";
                    status.style.color = "#34c759";
                    setTimeout(() => {
                        closeModals();
                        fetchPosts();
                    }, 1000);
                } else {
                    status.innerText = "Lỗi Server!";
                    status.style.color = "#ff3b30";
                }
            } catch (e) {
                status.innerText = "Lỗi kết nối mạng!";
                status.style.color = "#ff3b30";
            } finally {
                btn.innerText = "Đẩy Dữ Liệu";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
